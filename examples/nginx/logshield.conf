# nginx (or any TLS terminator / load balancer) in front of LogShield.
# By default LogShield replaces X-Forwarded-For with the address that connected
# to it, which here is nginx. Run LogShield with forwarded_for "append" so the
# application still sees the real client chain (docs/configuration.md).
upstream logshield {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/ssl/app.example.com.crt;
    ssl_certificate_key /etc/ssl/app.example.com.key;

    location / {
        proxy_pass http://logshield;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
