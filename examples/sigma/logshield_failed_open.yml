title: LogShield forwarded requests without inspection
id: 2092a1d5-0ef3-5cc2-8632-ed5b5e9ebe51
status: experimental
description: LogShield is configured with on_error open and forwarded a request uninspected because the engine failed. The control was bypassed.
references:
    - https://github.com/TurlaFSB/logshield/blob/main/docs/observability.md
author: LogShield project
date: 2026-10-17
tags:
    - attack.defense-evasion
    - attack.t1562
logsource:
    product: logshield
    service: proxy
detection:
    selection:
        failed_open: true
    condition: selection
fields:
    - remote
    - rules
    - path
    - host
    - id
falsepositives:
    - None expected; investigate every occurrence
level: high
