title: LogShield blocked a Log4Shell attempt
id: 45675401-33cd-55ab-a290-bd3b1bb45e7e
status: experimental
description: A request was blocked by LogShield because it contained a JNDI lookup or an evasion of one. The proxy did its job; the source is probing for Log4Shell.
references:
    - https://github.com/TurlaFSB/logshield/blob/main/docs/observability.md
author: LogShield project
date: 2026-10-17
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2021-44228
logsource:
    product: logshield
    service: proxy
detection:
    selection:
        msg: request blocked
        decision: malicious
    condition: selection
fields:
    - remote
    - rules
    - path
    - host
    - id
falsepositives:
    - Authorised vulnerability scanners
level: medium
