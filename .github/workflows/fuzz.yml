name: Fuzz (long)

# Longer fuzzing than the per-commit smoke run in ci.yml. Crashing inputs are
# uploaded so they can be reproduced and added to the regression corpus.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Time per target (Go duration)"
        default: "10m"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - engine:FuzzDecode
          - engine:FuzzResolve
          - engine:FuzzInspect
          - corpus:FuzzMutatedCorpus
          - proxy:FuzzNothingMaliciousLeaves
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '10m' }}
          TARGET: ${{ matrix.target }}
        run: make fuzz FUZZ_TARGETS="$TARGET" FUZZTIME="$FUZZTIME"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: internal/*/testdata/fuzz/
          if-no-files-found: ignore
