name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow token is read-only. Jobs that need more must
# opt in explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S style lab/*.sh lab/test/*.sh scripts/*.sh
      - name: POSIX syntax check
        run: for f in lab/*.sh lab/test/*.sh scripts/*.sh; do sh -n "$f"; done
      - name: actionlint
        run: |
          python3 -m pip install --quiet actionlint-py==1.7.12.*
          actionlint .github/workflows/*.yml
      - name: Sigma and Prometheus examples parse
        run: |
          python3 -m pip install --quiet pysigma==2.0.1 pyyaml
          python3 - <<'PY'
          import glob, yaml
          from sigma.collection import SigmaCollection
          for f in sorted(glob.glob("examples/sigma/*.yml")):
              rules = SigmaCollection.from_yaml(open(f).read()).rules
              assert rules and not [e for r in rules for e in r.errors], f
          yaml.safe_load(open("examples/prometheus/logshield.rules.yml"))
          PY
      - name: ruff
        run: |
          python3 -m pip install --quiet ruff==0.16.8
          ruff check lab
          ruff format --check lab

  image:
    name: Container image builds and runs unprivileged
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make docker VERSION=ci
      - name: Runs as non-root and validates configuration
        run: |
          test "$(docker image inspect logshield:ci --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --read-only --cap-drop ALL logshield:ci -version
          docker run --rm --read-only --cap-drop ALL -e LOGSHIELD_UPSTREAM=http://backend:8080 logshield:ci -check-config
      - name: Release archives are reproducible
        run: |
          PLATFORMS="linux/amd64" scripts/build-release.sh ci
          cp dist/SHA256SUMS /tmp/first
          PLATFORMS="linux/amd64" scripts/build-release.sh ci
          diff /tmp/first dist/SHA256SUMS

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The primary leg also enforces the race detector and coverage floor.
          # "stable" and "oldstable" are the two Go releases the Go project still
          # patches; 1.24 is kept only to prove the module's declared minimum
          # language version still builds.
          - { os: ubuntu-24.04, go: stable, primary: true }
          - { os: ubuntu-24.04, go: oldstable, primary: false }
          - { os: ubuntu-24.04, go: "1.24", primary: false }
          - { os: macos-latest, go: stable, primary: false }
          - { os: windows-latest, go: stable, primary: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Vet
        if: matrix.primary
        run: make vet
      - name: Test with race detector and enforce coverage floor
        if: matrix.primary
        run: make cover-check
      - name: Build and smoke test the binary
        if: matrix.primary
        run: |
          make build
          ./bin/logshield -version
      - name: Test (portability)
        if: ${{ !matrix.primary }}
        run: go test -shuffle=on -count=1 ./...

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          # 32-bit ARM catches integer-size assumptions; common on gateways.
          - { goos: linux, goarch: arm }
          - { goos: windows, goarch: amd64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Vet for the target
        run: go vet ./...
      - name: Build for the target
        run: go build -trimpath ./...

  modules:
    name: Modules are tidy and verified
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy must not change anything
        run: go mod tidy -diff
      - name: go mod verify
        run: go mod verify

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Scan for known vulnerabilities
        run: make vuln

  bench:
    name: Benchmarks compile and run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Run every benchmark once
        run: go test ./... -run '^$' -bench . -benchtime=1x

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Fuzz each target briefly
        run: make fuzz FUZZTIME=20s

  integration:
    name: Proxy in front of real backends
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Node, Python and the JDK are preinstalled on the runner image
        run: node --version && python3 --version && java -version
      - name: Run the integration tests
        run: make integration
        env:
          REQUIRE_BACKENDS: "1"
      - name: Test the lab canary's raw HTTP reader
        run: make lab-java
      - name: Smoke-test the lab control script
        run: make lab-scripts

  load-smoke:
    name: Latency budget smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: Added p99 latency must stay under the 5 ms budget
        working-directory: internal/proxy
        run: go test -tags load -count=1 -run TestLatencyOverhead .
        env:
          LOAD_DURATION: "3"
